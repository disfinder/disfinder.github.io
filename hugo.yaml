baseURL: 'https://www.disfinder.com'
locale: 'uk-ua'
title: 'disfinder.com 🇺🇦'
theme: hugo-book

markup:
  goldmark:
    renderer:
      unsafe: true

services:
  disqus:
    shortname: disfinder-com
params:
  BookDateFormat: "January 2, 2006"
  BookRepo: https://github.com/disfinder/disfinder.github.io

defaultContentLanguage: ua
languages:
  ua:
    disabled: false
    locale: "uk-UA"
    languageDirection: ""
    label: "🇺🇦Ukrainian"
    languageName: "🇺🇦Ukrainian"
    # title: "Ukraine"
    weight: 1
    contentDir: content/ua
  ru:
    contentDir: content/ru
    weight: 3
    label: "rUꞨꞨIAN"
    languageName: "rUꞨꞨIAN"

  en:
    disabled: false
    locale: "en-US"
    languageDirection: ""
    label: "🇺🇸English"
    languageName: "🇺🇸English"
    title: "disfinder.com 🇺🇸"
    weight: 2
    contentDir: content/en

